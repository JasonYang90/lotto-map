<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로또 판매점 지도</title>
<meta name="description" content="전국 로또 판매점과 1등 배출 명당을 지도에서 찾아요.">
<meta name="theme-color" content="#1f4fb8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="로또지도">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 전체 화면 지도 + 위쪽 검색 + 아래에서 끌어올리는 목록 시트 */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #17202e; --muted: #5e6a7c; --line: #dde2ea;
  --accent: #1f4fb8; --accent-soft: #e6edfb; --dot: #33507e;
  --ball1: #f5b800; --ball2: #3fa6dc; --ball3: #ec5a5a; --ball-ink: #1b1b1b;
  --shadow: 0 6px 24px rgba(10, 20, 40, 0.16);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f141c; --panel: #151c27; --ink: #e6ebf3; --muted: #93a0b4; --line: #263142;
    --accent: #7ea6ff; --accent-soft: #1d2a45; --dot: #8fa9d6; --shadow: 0 6px 24px rgba(0, 0, 0, 0.5); color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#map { position: fixed; inset: 0; background: var(--bg); }
.nomap { position: fixed; inset: 0; display: grid; place-items: center; padding: 140px 24px 200px; text-align: center; color: var(--muted); line-height: 1.6; }
.nomap b { color: var(--ink); display: block; margin-bottom: 6px; font-size: 16px; }

.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: calc(var(--top) + 10px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.searchbox { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 0 6px 0 14px; }
.searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; outline: none; }
.searchbox .clear { border: 0; background: transparent; width: 36px; height: 36px; color: var(--muted); font-size: 18px; cursor: pointer; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip, .chips select { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; box-shadow: 0 2px 8px rgba(10, 20, 40, 0.08); cursor: pointer; white-space: nowrap; }
.chips select { appearance: none; -webkit-appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.toast { justify-self: center; background: var(--ink); color: var(--panel); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; max-width: 100%; box-shadow: var(--shadow); }

.fab { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 15; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; transition: bottom 0.2s; }
.fab svg { width: 22px; height: 22px; color: var(--accent); }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(10, 20, 40, 0.14); display: flex; flex-direction: column; height: 150px; transition: height 0.22s ease; padding-bottom: var(--bottom); max-width: 720px; margin: 0 auto; }
.sheet.dragging { transition: none; }
.grab { touch-action: none; cursor: grab; padding: 8px 16px 0; }
.grab .bar { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sheethead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheethead select { border: 0; background: transparent; font-weight: 600; color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
.item { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); cursor: pointer; }
.item:active { background: var(--bg); }
.ball { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 12.5px var(--font-mono); color: var(--ball-ink); box-shadow: inset -3px -4px 0 rgba(0, 0, 0, 0.12); }
.ball.none { border: 1.5px dashed var(--line); box-shadow: none; }
.item .name { font-weight: 600; overflow-wrap: anywhere; }
.item .addr { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item .dist { color: var(--accent); font-weight: 600; font-size: 13px; white-space: nowrap; }
.more { margin: 14px 16px 20px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: transparent; width: calc(100% - 32px); cursor: pointer; }
.empty { padding: 26px 16px; color: var(--muted); }

.detail { overflow-y: auto; flex: 1; min-height: 0; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; align-content: start; }
.detail .back { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px 0; cursor: pointer; }
.detail h2 { margin: 0; font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.detail .meta { color: var(--muted); overflow-wrap: anywhere; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.actions a { display: block; text-align: center; padding: 11px 8px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--line); color: var(--ink); }
.actions a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.wins { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.wins .sum { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.wins .sum .ball { width: 38px; height: 38px; font-size: 15px; }
.split { color: var(--muted); font-weight: 400; font-size: 13px; }
.draws { display: flex; flex-wrap: wrap; gap: 6px; }
.draws span { font: 500 12px var(--font-mono); padding: 4px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.wins .chip { justify-self: start; box-shadow: none; }

/* 지도 위 표시 */
.me { width: 18px; height: 18px; border-radius: 50%; background: #1f6bff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(31, 107, 255, 0.22); }
.pick { padding: 5px 10px; background: var(--ink); color: var(--panel); border-radius: 8px; font: 600 13px var(--font-body); white-space: nowrap; transform: translateY(-34px); box-shadow: var(--shadow); }

@media (min-width: 900px) {
  .top { right: auto; width: 420px; }
  .sheet { left: 12px; right: auto; bottom: 12px; top: calc(var(--top) + 118px); width: 420px; height: auto !important; border-radius: 16px; margin: 0; }
  .grab { display: none; }
  .sheethead { padding-top: 12px; }
  .fab { bottom: 24px !important; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .fab { transition: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="nomap" id="nomap" hidden></div>

<header class="top">
  <div class="searchbox">
    <input type="search" id="q" placeholder="상호명·주소 검색 (예: 노원 스파)" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clearQ" aria-label="검색어 지우기" hidden>×</button>
  </div>
  <div class="chips">
    <button class="chip" id="near" aria-pressed="false">내 주변</button>
    <button class="chip" id="onlyWin" aria-pressed="false">1등 명당</button>
    <select id="si" aria-label="시·도"><option value="">전국</option></select>
    <select id="gu" aria-label="구·군" hidden><option value="">구·군 전체</option></select>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</header>

<button class="fab" id="locate" aria-label="내 위치로 이동">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
</button>

<section class="sheet" id="sheet" aria-label="판매점 목록">
  <div class="grab" id="grab"><div class="bar"></div></div>
  <div id="listView" style="display:flex;flex-direction:column;min-height:0;flex:1">
    <div class="sheethead">
      <span id="count">불러오는 중…</span>
      <select id="sort" aria-label="정렬">
        <option value="wins">1등 많은 순</option>
        <option value="dist">가까운 순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <ul class="list" id="list"></ul>
  </div>
  <div class="detail" id="detail" hidden></div>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
